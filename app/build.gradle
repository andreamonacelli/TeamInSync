plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { instr ->
        localProperties.load(instr)
    }
}

android {
    namespace 'com.monacdev.teaminsync'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.monacdev.teaminsync"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def oneSignalKey = localProperties.getProperty("ONESIGNAL_REST_API_KEY")
        buildConfigField "String", "ONESIGNAL_REST_API_KEY", "\"${oneSignalKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation libs.firebase.auth
    implementation 'com.google.firebase:firebase-database:22.0.1'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'com.onesignal:OneSignal:5.7.2'
    implementation 'com.cloudinary:cloudinary-android:3.1.2'
    implementation libs.legacy.support.v4
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}